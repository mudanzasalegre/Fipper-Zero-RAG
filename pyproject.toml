[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flipperzero-rag"
version = "0.2.0"
description = "Local, source-grounded RAG assistant for the Flipper Zero ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Flipper Zero RAG Contributors"}]
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
flipper-rag = "flipper_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flipper_rag = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
