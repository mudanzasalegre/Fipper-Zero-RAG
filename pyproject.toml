[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flipperzero-rag"
version = "0.8.0"
description = "Local, source-grounded RAG assistant for the Flipper Zero ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Flipper Zero RAG Contributors"}]
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "numpy>=1.26,<3"]
pdf = ["pypdf>=5,<7"]
ann = ["usearch>=2.18,<3", "numpy>=1.26"]
rerank = ["sentence-transformers>=3.4,<6"]
full = ["usearch>=2.18,<3", "numpy>=1.26", "sentence-transformers>=3.4,<6", "pypdf>=5,<7"]

[project.scripts]
flipper-rag = "flipper_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flipper_rag = ["web/*.html", "data/*.json", "data/dev_templates/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
