name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src
      - name: Test suite
        run: python -m pytest -q
      - name: Protocol Lab v0.9 offline smoke (synthetic files only)
        env:
          RAG_EMBED_PROVIDER: none
          RAG_CHAT_PROVIDER: none
          RAG_DB_PATH: ${{ runner.temp }}/flipper-lab-ci.sqlite3
        run: |
          flipper-rag lab formats
          flipper-rag lab analyze --file examples/protocol_lab/demo-ir.ir
          flipper-rag lab analyze --file examples/protocol_lab/demo-nfc.nfc
          flipper-rag lab batch --directory examples/protocol_lab
          flipper-rag lab compare --before examples/protocol_lab/demo-ir.ir --after examples/protocol_lab/demo-ir.ir
      - name: Validate source catalog
        run: flipper-rag sources --catalog-file sources.json
      - name: Offline retrieval benchmark (no LLM, no network)
        env:
          RAG_EMBED_PROVIDER: none
          RAG_CHAT_PROVIDER: none
          RAG_DB_PATH: ${{ runner.temp }}/flipper-rag-ci.sqlite3
        run: |
          flipper-rag ingest --path knowledge/starter --source-id starter
          flipper-rag eval --file benchmarks/offline.jsonl --mode lexical --top-k 6 --min-recall 0.85
          flipper-rag audit
      - name: Validate and benchmark protocol corpus (offline)
        env:
          RAG_EMBED_PROVIDER: none
          RAG_CHAT_PROVIDER: none
          RAG_DB_PATH: ${{ runner.temp }}/flipper-protocols-ci.sqlite3
        run: |
          flipper-rag protocols validate
          flipper-rag protocols index
          flipper-rag ingest --path knowledge/protocols --source-id guias-protocolos
          flipper-rag eval --file benchmarks/protocols_offline.jsonl --mode lexical --top-k 6 --min-recall 0.85
          flipper-rag audit

      - name: Validate v0.6 ontology and offline capability benchmark
        env:
          RAG_EMBED_PROVIDER: none
          RAG_CHAT_PROVIDER: none
          RAG_DB_PATH: ${{ runner.temp }}/flipper-ontology-ci.sqlite3
        run: |
          flipper-rag ontology validate
          flipper-rag ontology eval --file benchmarks/ontology_v06.jsonl
          flipper-rag ontology index
          flipper-rag audit


      - name: v1.0 integrated knowledge health (offline)
        env:
          RAG_EMBED_PROVIDER: none
          RAG_CHAT_PROVIDER: none
          RAG_DB_PATH: ${{ runner.temp }}/flipper-platform-ci.sqlite3
        run: |
          flipper-rag platform sync --local --internal
          flipper-rag platform audit
          flipper-rag platform status

  ann-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real USearch backend
        run: python -m pip install -e '.[dev,ann]'
      - name: Test native ANN persistence and entire suite
        run: python -m pytest -q
