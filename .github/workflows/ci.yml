name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src
      - name: Test suite
        run: python -m pytest -q
      - name: Validate source catalog
        run: flipper-rag sources --catalog-file sources.json
      - name: Offline retrieval benchmark (no LLM, no network)
        env:
          RAG_EMBED_PROVIDER: none
          RAG_CHAT_PROVIDER: none
          RAG_DB_PATH: ${{ runner.temp }}/flipper-rag-ci.sqlite3
        run: |
          flipper-rag ingest --path knowledge/starter --source-id starter
          flipper-rag eval --file benchmarks/offline.jsonl --mode lexical --top-k 6 --min-recall 0.85
          flipper-rag audit

  ann-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real USearch backend
        run: python -m pip install -e '.[dev,ann]'
      - name: Test native ANN persistence and entire suite
        run: python -m pytest -q
