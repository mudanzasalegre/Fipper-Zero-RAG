name: Development assistant - real FAP smoke build
# Runs only when manually requested: downloads official SDK/toolchain and
# compiles our 3 packaged educational projects. Never launches/flashes devices.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ufbt-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install RAG and official uFBT
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install ufbt
      - name: Download SDK for official release channel
        run: ufbt update --channel=release
      - name: Build all three FAP tutorial projects (no device actions)
        run: |
          mkdir -p "$RUNNER_TEMP/fap-smoke"
          flipper-rag dev smoke --output "$RUNNER_TEMP/fap-smoke" --execute --timeout 600
      - name: Verify built FAP artifacts
        run: |
          test -n "$(find "$RUNNER_TEMP/fap-smoke" -path '*/dist/*.fap' -type f -print -quit)"
          find "$RUNNER_TEMP/fap-smoke" -path '*/dist/*.fap' -type f -printf '%P\t%s bytes\n'
      - name: Upload educational FAP build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flipper-rag-v08-fap-smoke
          path: ${{ runner.temp }}/fap-smoke/**/dist/*.fap
          if-no-files-found: error
          retention-days: 7
